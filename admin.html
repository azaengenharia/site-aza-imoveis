<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | AZA Imoveis</title>
    <link rel="icon" href="assets/logos/favicon.ico" sizes="any">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="admin-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="AZA Imoveis">
        <img src="assets/logos/aza-logo.png" alt="">
        <span>AZA Imoveis</span>
      </a>
      <nav class="nav" aria-label="Navegacao principal">
        <a href="index.html">Site</a>
        <a href="index.html#imoveis">Imoveis</a>
        <a href="index.html#contato">Contato</a>
      </nav>
    </header>

    <main class="admin-shell">
      <section class="admin-intro">
        <p class="eyebrow">Prototipo</p>
        <h1>Cadastro visual de imoveis</h1>
        <p>Esta tela salva no navegador para teste. Depois conectamos em Supabase, Decap CMS ou GitHub API.</p>
      </section>

      <section class="admin-layout">
        <form class="admin-form" id="property-form">
          <label>
            <span>Titulo</span>
            <input name="title" required placeholder="Casa a venda no Centro">
          </label>
          <label>
            <span>Codigo</span>
            <input name="id" required placeholder="AZA-001">
          </label>
          <label>
            <span>Finalidade</span>
            <select name="purpose">
              <option>Venda</option>
              <option>Locacao</option>
            </select>
          </label>
          <label>
            <span>Tipo</span>
            <select name="type">
              <option>Casa</option>
              <option>Apartamento</option>
              <option>Sobrado</option>
              <option>Lote</option>
              <option>Comercial</option>
            </select>
          </label>
          <label>
            <span>Cidade</span>
            <input name="city" required placeholder="Piumhi">
          </label>
          <label>
            <span>Bairro</span>
            <input name="neighborhood" placeholder="Centro">
          </label>
          <label>
            <span>Valor</span>
            <input name="price" type="number" required placeholder="450000">
          </label>
          <label>
            <span>Area m2</span>
            <input name="area" type="number" placeholder="160">
          </label>
          <label>
            <span>Quartos</span>
            <input name="bedrooms" type="number" min="0" value="3">
          </label>
          <label>
            <span>Suites</span>
            <input name="suites" type="number" min="0" value="1">
          </label>
          <label>
            <span>Banheiros</span>
            <input name="bathrooms" type="number" min="0" value="2">
          </label>
          <label>
            <span>Vagas</span>
            <input name="parking" type="number" min="0" value="2">
          </label>
          <label class="wide">
            <span>Imagem</span>
            <select name="image">
              <option value="assets/images/hero-residencia.jpg">Residencia destaque</option>
              <option value="assets/images/casa-detalhe.jpg">Casa detalhe</option>
              <option value="assets/images/interior.jpg">Interior</option>
              <option value="assets/images/obra-casa.jpg">Fachada em obra</option>
            </select>
          </label>
          <label class="wide">
            <span>Descricao</span>
            <textarea name="description" rows="4" placeholder="Resumo comercial do imovel"></textarea>
          </label>
          <label class="check wide">
            <input name="featured" type="checkbox">
            <span>Marcar como destaque</span>
          </label>
          <button type="submit">Salvar imovel</button>
          <button class="ghost-button" type="button" id="clear-local">Limpar testes locais</button>
        </form>

        <aside class="admin-preview">
          <p class="eyebrow">Preview</p>
          <h2>Como aparece no site</h2>
          <div id="admin-preview-card"></div>
        </aside>
      </section>
    </main>

    <script src="data/properties.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
